name: Bug汇报
description: 反馈本插件的Bug或问题
labels: [ "bug" ]
assignees:
  - balugaq
body:
  - type: markdown
    attributes:
      value: |
        ## 欢迎来到 BigInteractionMenu 的问题追踪器
        你正在反馈 BigInteractionMenu 出现的 Bug。

        <strong><i>你必须填写标注为星号（*）的表单项</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项目
      description: 在汇报之前，你需要确认
      options:
        - label: 你使用的是从[GitHub Release](https://github.com/balugaq/BigInteractionMenu/releases)下载的版本
        - label: 你已经寻找过[已知问题列表](https://github.com/balugaq/BigInteractionMenu/issues)，且没有找到相同的问题
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: |
        详细描述你要汇报的问题
        提供详细的信息能让我们更快地处理问题
      placeholder: 只说"不能用"没法让开发者定位问题。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: |
        请详细描述如何才能复现该问题
        如果有视频，请在此提供视频链接
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: |
        你觉得应该发生什么
        有时候，问题的原因是你误解了某个功能。
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: 服务器日志
      description: |
        请上传 latest.log 至 [https://mclo.gs](https://mclo.gs) 并在此填入链接。
        **不要直接在这里粘贴错误报告**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: dropdown
    id: server-software
    attributes:
      label: 服务端软件
      description: 请选择你服务端所使用的软件
      options:
        - Paper
        - Purpur
        - 其他 (请在问题描述里写明)
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft 版本
      description: 请填写你的 Minecraft 版本
    validations:
      required: true

  - type: input
    id: version-plugin
    attributes:
      label: 插件版本
      description: |
        请填写插件版本
    validations:
      required: true
